on:
  schedule:
    - cron:  "15 21 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout My Repo's YTlive branch
      uses: actions/checkout@v4
      with:
        ref: YTlive 

    - name: Download M3U from Remote Main Branch and Process
      run: |
        curl -s https://raw.githubusercontent.com/lzh81569/lzh81569.github.io/refs/heads/main/yx.m3u -o cable.m3u
        sed -i 's/192.168.1.3/v6.sucun.top/g' cable.m3u
        sed -i 's/ 4K/4K/g' cable.m3u
        sed -i 's/ HD//g' cable.m3u

    - name: Commit and Push changes to My Repo's TV branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cable.m3u
        git commit -m "Sync cable.m3u from remote main, applied to YTlive branch" || echo "No changes to commit"
        git push origin YTlive
